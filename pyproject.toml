[project]
name = "tsclaude"
version = "0.1.0"
description = "Trading System Claude — local-first crypto research, backtesting and paper-trading platform (paper only)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "websockets>=13",
    "numpy>=2.1",
    "pyyaml>=6.0",
    "pyarrow>=17",
    "duckdb>=1.1",
]

[project.scripts]
tsclaude = "tsclaude.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsclaude"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: touches real Binance endpoints; run only on the owner's machine or allowlisted environments",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ", "RUF", "PT", "SIM"]
ignore = ["S101"]  # asserts are fine in tests; production code avoids them by review

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ"]
"scripts/**" = ["S", "T20"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["tsclaude"]
mypy_path = "src"

[[tool.mypy.overrides]]
# pyarrow ships no type information (use confined to store/parquet_codec.py); duckdb stubs
# vary by version (use confined to Lake.build_catalog).
module = ["pyarrow", "pyarrow.*", "duckdb", "duckdb.*"]
ignore_missing_imports = true
