universe:
  market: spot
  # SOLUSDT excluded pending owner decision D-F (its gaps make most training windows grade X, WF-3)
  symbols: [BTCUSDT, ETHUSDT, DOGEUSDT, XRPUSDT]
data:                # D-05; fixed, cannot be moved by a preregistration
  development: ['2022-01-01', '2025-01-01']
  validation: ['2025-01-01', '2026-01-01']
  holdout: ['2026-01-01', '2026-10-01']   # D-F: the 2026 months must be accepted first (H1-9)
  dataset_ids: null  # H1-11: pin the exact dataset ids before the freeze
walk_forward:
  anchor: auto       # freeze refuses 'auto': fix the first train month (after the
                     # strategy warm-up) so the folds are pinned (re-review N2)
  end: '2025-01-01'  # the last test window ends at or before this month start
  initial_train_months: 12
  test_months: 3
  # Embargo from the required time exit (H1-7), interval 15m:
  #   fill within 1 validity bar after the decision, then the time exit after time_exit_bars bars
  #   max scheduled holding = (time_exit_bars + 1) x 15 min = (48 + 1) x 15 = 735 min
  #   embargo 1440 min >= 735 min; the 705 min margin covers exits deferred by candles without
  #   trades and short data gaps (book: `_hold_position`).
  #   If H1-1 selects 1h: (48 + 1) x 60 = 2940 min -> the embargo must be raised (e.g. 4320).
  embargo_minutes: 1440
  time_exit_required: true
  n_min: 300         # the certification floor (research/stats/certify.py)
  min_oos_coverage: 1.0
objective: certified_margin_lcb_then_p_lcb   # ADR-0012, fixed
selection_rule: full-development-train-v1     # H1-2
trial_budget:
  max_configurations: 24
  max_registry_trials: null
  counting: PENDING          # owner decision D-C: configurations | registry_rows (H1-4)
holdout_procedure: PENDING   # owner decision D-D: two-stage preregistration (H1-3)
risk_compatibility: PENDING  # owner decision D-E: live floor 1.5 rejects every tp_r here (H1-5)
rejection_criteria:
  - certified margin lower bound <= 0
  - expectancy lower bound <= 0
  - fewer than 300 effective trades
  - cost stress x1.5 not certified
  - no edge over the random-entry control
  - any integrity problem (grade X)
  - "validation max drawdown > 0.20 of peak equity (PROPOSED, H1-12; owner to confirm)"
max_loss_r_policy: L-10 default
