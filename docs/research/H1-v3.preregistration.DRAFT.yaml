  - {interval: 15m, atr_n: 14, rank_m: 96, rank_max: 0.25, range_n: 20, vol_n: 20, vol_z_min: 2.0, trend_n: 50, stop_atr: 1.0, tp_r: 2.0, max_cost_r: 0.2, watch_atr: 0.5, time_exit_bars: 48}
