name: CI

on:
  push:
    branches: [main, "task/**", "acceptance/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      pytest_mode:
        description: >-
          serial: the full workflow, as on push (formal acceptance runs). bench: experimental
          (CI proposal P2) - the serial python jobs and 4-worker python jobs side by side on the
          same commit, then a comparison job. stress-commit / stress-round: 4-worker python jobs
          with the integration-test latency fixture.
        type: choice
        options: [serial, bench, stress-commit, stress-round]
        default: serial

permissions:
  contents: read

# P1 (CI proposal): an ordinary push still supersedes the run of an older push on the same
# branch. A dispatched run (formal acceptance, benchmark) gets a group of its own (its run id),
# so no push or other dispatch can cancel it or replace it while pending. A push to
# acceptance/** gets one group per commit: only another run of the same commit on the same
# branch (for example the branch deleted and pushed again) can replace it while it is pending.
concurrency:
  group: "ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || startsWith(github.ref, 'refs/heads/acceptance/') && format('sha-{0}', github.sha) || 'push' }}"
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/heads/acceptance/') }}

jobs:
  python:
    name: python (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch' || inputs.pytest_mode == 'serial' || inputs.pytest_mode == 'bench'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: Lock (only while uv.lock is not committed yet)
        if: hashFiles('uv.lock') == ''
        shell: bash
        run: ./scripts/ci/run.sh lock uv lock
      - name: Sync
        shell: bash
        run: ./scripts/ci/run.sh sync uv sync --all-groups
      - name: Ruff lint
        shell: bash
        run: ./scripts/ci/run.sh ruff-lint uv run ruff check src tests scripts
      - name: Ruff format
        shell: bash
        run: ./scripts/ci/run.sh ruff-format uv run ruff format --check src tests scripts
      - name: Mypy (strict)
        shell: bash
        run: ./scripts/ci/run.sh mypy uv run mypy src
      - name: Pytest
        shell: bash
        env:
          # P0: the OD-2 restart outcomes as JSON (tests/conftest.py writes it; reporting only)
          TSC_RESTART_REPORT: ci-logs/restart-report-${{ matrix.os }}-serial.json
        run: >-
          ./scripts/ci/run.sh pytest uv run pytest -q
          --junitxml=ci-logs/junit-${{ matrix.os }}-serial.xml --durations=50
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: ./scripts/ci/annotate.sh
      # P0 (CI proposal): per-test timing and outcomes, for the job summary and for comparing
      # runs. Reporting only: these steps never change the job result.
      - name: Test report (P0, reporting only)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          uv run --no-sync python -I scripts/ci/junit_summary.py summarize \
            "ci-logs/junit-${{ matrix.os }}-serial.xml" --label "python serial (${{ matrix.os }})" \
            --outcomes-out "ci-logs/outcomes-${{ matrix.os }}-serial.json" --summary-out "$GITHUB_STEP_SUMMARY"
          uv pip freeze > "ci-logs/freeze-${{ matrix.os }}-serial.txt"
          # written to a file first: `git status | head` would end in SIGPIPE (exit 141) under
          # pipefail once the list is longer than the head
          git status --porcelain --untracked-files=normal --ignored > "ci-logs/tree-${{ matrix.os }}-serial.txt"
          { echo "### Working tree after pytest (${{ matrix.os }}, report only; ignored files listed too)"; echo '```';
            head -n 50 "ci-logs/tree-${{ matrix.os }}-serial.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test report (P0)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}-serial
          path: |
            ci-logs/junit-*.xml
            ci-logs/outcomes-*.json
            ci-logs/restart-report-*.json
            ci-logs/freeze-*.txt
          if-no-files-found: warn
      - name: Upload generated uv.lock
        if: hashFiles('uv.lock') != '' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: uv-lock
          path: uv.lock

  python-parallel:
    # CI proposal P2, EXPERIMENTAL: only on workflow_dispatch with pytest_mode bench or stress-*.
    # Never on push, never part of a formal acceptance run. pytest-xdist is installed into this
    # job's environment only (pyproject.toml is unchanged); every other package is what the
    # serial job gets, and the comparison job checks that.
    name: python 4-worker experimental (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.pytest_mode != 'serial'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      MODE: ${{ inputs.pytest_mode == 'bench' && 'parallel' || inputs.pytest_mode }}
      TSC_TEST_LATENCY_MS: ${{ inputs.pytest_mode == 'stress-commit' && '40' || inputs.pytest_mode == 'stress-round' && '80' || '0' }}
      TSC_TEST_LATENCY_MODE: ${{ inputs.pytest_mode == 'stress-round' && 'round' || 'commit' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: Lock (only while uv.lock is not committed yet)
        if: hashFiles('uv.lock') == ''
        shell: bash
        run: ./scripts/ci/run.sh lock uv lock
      - name: Sync
        shell: bash
        run: ./scripts/ci/run.sh sync uv sync --all-groups
      - name: Add pytest-xdist to this job's environment only
        shell: bash
        run: ./scripts/ci/run.sh xdist uv pip install "pytest-xdist==3.8.0"
      - name: Ruff lint
        shell: bash
        run: ./scripts/ci/run.sh ruff-lint uv run --no-sync ruff check src tests scripts
      - name: Ruff format
        shell: bash
        run: ./scripts/ci/run.sh ruff-format uv run --no-sync ruff format --check src tests scripts
      - name: Mypy (strict)
        shell: bash
        run: ./scripts/ci/run.sh mypy uv run --no-sync mypy src
      - name: Pytest, 4 workers, one file per worker at a time
        shell: bash
        env:
          TSC_RESTART_REPORT: ci-logs/restart-report-${{ matrix.os }}-${{ env.MODE }}.json
        run: >-
          ./scripts/ci/run.sh pytest uv run --no-sync pytest -q -n 4 --dist loadfile
          --junitxml=ci-logs/junit-${{ matrix.os }}-${{ env.MODE }}.xml --durations=50
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: ./scripts/ci/annotate.sh
      - name: Test report
        if: always()
        shell: bash
        run: |
          uv run --no-sync python -I scripts/ci/junit_summary.py summarize \
            "ci-logs/junit-${{ matrix.os }}-$MODE.xml" --label "python 4-worker $MODE (${{ matrix.os }})" \
            --outcomes-out "ci-logs/outcomes-${{ matrix.os }}-$MODE.json" --summary-out "$GITHUB_STEP_SUMMARY"
          uv pip freeze > "ci-logs/freeze-${{ matrix.os }}-$MODE.txt"
      - name: No test changed a tracked file (resource isolation)
        if: always()
        shell: bash
        run: |
          changed=$(git status --porcelain --untracked-files=no)
          # written to a file first: `git status | head` would end in SIGPIPE (exit 141) under
          # pipefail once the list is longer than the head (bench run 42911839409, ubuntu)
          git status --porcelain --untracked-files=normal --ignored > "ci-logs/tree-${{ matrix.os }}-$MODE.txt"
          { echo "### Working tree after pytest (${{ matrix.os }}, $MODE; ignored files listed too)"; echo '```';
            head -n 50 "ci-logs/tree-${{ matrix.os }}-$MODE.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$changed" ]; then echo "::error::tests changed tracked files:"; echo "$changed"; exit 1; fi
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}-${{ env.MODE }}
          path: |
            ci-logs/junit-*.xml
            ci-logs/outcomes-*.json
            ci-logs/restart-report-*.json
            ci-logs/freeze-*.txt
            ci-logs/*.log
          if-no-files-found: error

  compare:
    # CI proposal P2, EXPERIMENTAL: the 4-worker run must give exactly the serial run's results
    name: serial vs 4-worker comparison (experimental)
    needs: [python, python-parallel]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.pytest_mode == 'bench'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: test-report-*
          path: reports
      - name: Same tests, same outcomes, same OD-2 report, same packages (any gap fails)
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          for os in ubuntu-latest windows-latest; do
            s="reports/test-report-$os-serial"; p="reports/test-report-$os-parallel"
            echo "### $os" >> "$GITHUB_STEP_SUMMARY"
            for check in "compare $s/outcomes-$os-serial.json $p/outcomes-$os-parallel.json" \
                "compare-json $s/restart-report-$os-serial.json $p/restart-report-$os-parallel.json" \
                "compare-freeze $s/freeze-$os-serial.txt $p/freeze-$os-parallel.txt --ignore pytest-xdist --ignore execnet"; do
              # shellcheck disable=SC2086
              out=$(python3 -I scripts/ci/junit_summary.py $check 2>&1); r=$?
              echo "- \`${check%% *}\` exit $r: $(echo "$out" | head -1)" >> "$GITHUB_STEP_SUMMARY"
              echo "== $os: $check -> exit $r"; echo "$out"
              [ "$r" -eq 0 ] || rc=1
            done
          done
          exit "$rc"

  m2-cross-os:
    # Focused, verbose evidence for the M2 gate "cross-OS reproducibility hash". It runs the same two
    # existing tests (four pinned outputs) on the same commit on Windows and Linux. It does NOT replace
    # or filter the full-suite `python` job above, and it changes no constant or test.
    name: m2 cross-os gate (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch' || inputs.pytest_mode == 'serial'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: Lock (only while uv.lock is not committed yet)
        if: hashFiles('uv.lock') == ''
        shell: bash
        run: uv lock
      - name: Sync
        shell: bash
        run: uv sync --all-groups
      - name: Provenance (commit, platform, versions, lockfile, pinned constants)
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### m2 cross-os provenance (${{ matrix.os }})"
            echo "- commit: ${GITHUB_SHA}"
            echo "- uv: $(uv --version)"
            uv run python -I -c "import sys,platform,importlib.metadata as m; print('- python:', sys.version.split()[0], platform.platform()); print('- deps:', ', '.join(f'{n}=={m.version(n)}' for n in ('numpy','pyarrow','duckdb','pyyaml','pydantic','pytest','hypothesis')))"
            echo "- uv.lock sha256 (generated in CI, not committed): $(sha256sum uv.lock | cut -d' ' -f1)"
            echo "- test files sha256: $(sha256sum tests/unit/sim/test_sim_determinism.py tests/unit/backtest/test_bt_runner.py | cut -d' ' -f1 | paste -sd' ' -)"
            echo "- pinned constants in source:"
            grep -hE '^(PINNED_FINGERPRINT_SEED0|GOLDEN_MANIFEST|GOLDEN_METRICS|GOLDEN_TRADES) = ' tests/unit/sim/test_sim_determinism.py tests/unit/backtest/test_bt_runner.py | sed 's/^/    /'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: M2 cross-OS pinned outputs (verbose, both tests required)
        shell: bash
        run: |
          set -uo pipefail
          t1='tests/unit/sim/test_sim_determinism.py::test_golden_fingerprint_is_pinned'
          t2='tests/unit/backtest/test_bt_runner.py::test_golden_hashes_identical_across_platforms'
          uv run pytest -v -p no:cacheprovider "$t1" "$t2" 2>&1 | tee m2-cross-os.log
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "::error::pytest exit $rc"; exit 1; }
          for t in "$t1" "$t2"; do
            grep -F "$t PASSED" m2-cross-os.log >/dev/null || { echo "::error::not collected or not passed: $t"; exit 1; }
          done
          [ "$(grep -c ' PASSED' m2-cross-os.log)" -eq 2 ] || { echo "::error::expected exactly 2 passed tests"; exit 1; }
          { echo "### m2 cross-os result (${{ matrix.os }})"; grep -E ' (PASSED|FAILED|ERROR)|passed|failed' m2-cross-os.log; } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: frontend (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch' || inputs.pytest_mode == 'serial'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend
        id: detect
        shell: bash
        working-directory: .
        run: echo "present=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        if: steps.detect.outputs.present == 'true'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 22
      - name: Install
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: ../scripts/ci/run.sh fe-install pnpm install --no-frozen-lockfile
      - name: Typecheck
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: ../scripts/ci/run.sh fe-typecheck pnpm run --if-present typecheck
      - name: Test
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: ../scripts/ci/run.sh fe-test pnpm test
      - name: Build
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: ../scripts/ci/run.sh fe-build pnpm build
      - name: Report failures as annotations
        if: failure()
        shell: bash
        working-directory: .
        run: ./scripts/ci/annotate.sh
      - name: Upload bundle and lockfile
        if: steps.detect.outputs.present == 'true' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: |
            src/tsclaude/web/static
            frontend/pnpm-lock.yaml

  guards:
    name: safety guards
    if: github.event_name != 'workflow_dispatch' || inputs.pytest_mode == 'serial'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No private/signed exchange endpoints or order placement (paper-only rule)
        shell: bash
        run: |
          set -euo pipefail
          pattern='/api/v3/order|/fapi/v1/order|/sapi/|listenKey|X-MBX-APIKEY|signature=|/api/v3/account|/fapi/v2/account'
          if grep -rEn "$pattern" src frontend/src 2>/dev/null; then
            echo "::error::Private/signed Binance endpoint referenced in product code"
            exit 1
          fi
      - name: No committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$'; then echo "::error::.env committed"; exit 1; fi
          if git grep -nE 'sk-ant-[A-Za-z0-9_-]{20,}' -- . ':!*.md'; then
            echo "::error::Anthropic key-like string committed"; exit 1
          fi
